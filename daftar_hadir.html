<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Daftar Hadir - AutoSave</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .header { text-align: center; margin-bottom: 20px; }
    .info { margin-bottom: 30px; width: 100%; border-spacing: 0 10px; }
    .info td { padding: 6px 10px; text-align: left; }
    .label { width: 180px; vertical-align: top; }
    
    /* Perbaikan posisi input tanggal dan waktu */
    .info input[type="date"], .info input[type="time"] { 
      width: auto; 
      padding: 5px; 
      text-align: left; /* Rata kiri */
      display: block; 
    }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table, th, td { border: 2px solid black; }
    th, td { padding: 8px; text-align: center; vertical-align: middle; }
    th { background-color: #005baa; color: white; }
    
    /* Input teks di tabel tetap di tengah */
    input[type="text"] { width: 100%; border: none; padding: 5px; box-sizing: border-box; text-align: center; }
    
.upload-area {
    cursor: pointer;
    text-align: center;
    vertical-align: middle;
    min-height: 70px;
    padding: 5px;
}

.ttd-preview {
    display: block;
    max-width: 120px;
    max-height: 60px;
    margin: 0 auto;
}

.hidden-file { display: none; }
    .ttd-preview { max-height: 60px; max-width: 120px; display: block; }
    
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; background: #eee; padding: 10px; border-radius: 5px; flex-wrap: wrap; }
    .no-print { display: block; }
    @media print { .no-print { display: none !important; } }
    .highlight { background-color: #005baa; color: white; font-weight: bold; }
  </style>
</head>
<body>

<div class="toolbar no-print">
  <button onclick="saveAll(true)">💾 Simpan</button>
  <button onclick="window.print()">🖨️ Print PDF</button>
  <button onclick="exportJSON()">⬇️ Export JSON</button>
  <button onclick="document.getElementById('importFile').click()">⬆️ Import JSON</button>
  <input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
  <button onclick="resetAll()" style="background:#dc3545; color:white;">🗑️ Reset Semua</button>
  <span>Auto-save aktif</span>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
  <img src="https://i.ibb.co.com/fdM0L7ZB/Danantara-Indonesia-no-SW-svg.png" style="height: 40px;">
  <img src="https://i.postimg.cc/pTwKn3m0/KAI-LOGO.png" style="height: 30px;">
</div>

<div class="header"><h2>DAFTAR HADIR</h2></div>

<table class="info" id="infoTable">
<tr class="highlight">
    <td class="label" style="text-align:center;">NAMA KEGIATAN</td>
    <td style="text-align:center;">PEMERIKSAAN BERSAMA</td>
</tr>
  <tr><td class="label">Tanggal</td><td><input type="date" id="tgl"></td></tr>
  <tr><td class="label">Waktu</td><td><input type="time" id="waktu"></td></tr>
  <tr><td class="label">Tempat</td><td><strong>STASIUN KARANGPUCUNG</strong></td></tr>
</table>

<div class="no-print" style="text-align: right; margin-bottom: 10px;">
  <button onclick="addRow()">+ Tambah</button>
  <button onclick="removeRow()">- Hapus</button>
</div>

<table id="personnelTable">
  <thead>
    <tr><th>No</th><th>Nama</th><th>Nipp</th><th>Jabatan</th><th>Kedudukan</th><th>TTD</th></tr>
  </thead>
<tbody>
  <tr>
    <td>1</td>

<td>
    <select onchange="isiDataPegawai(this)">
        <option value="">-- Pilih Nama --</option>
        <option value="Yusup Roni">Yusup Roni</option>
        <option value="Cecep Iman Nurdin">Cecep Iman Nurdin</option>
        <option value="Abung B.Z">Abung B.Z</option>
        <option value="Dian F">Dian F</option>
        <option value="Fajar P">Fajar P</option>
        <option value="Alek N">Alek N</option>
        <option value="Andri Perdiansyah">Andri Perdiansyah</option>
        <option value="Maman Suparman">Maman Suparman</option>
    </select>
</td>

<td><input type="text" readonly></td>
<td><input type="text" readonly></td>
<td><input type="text" readonly></td>

    <td class="upload-area" onclick="this.querySelector('input').click()">
      <img class="ttd-preview" src="">
      <input type="file" class="hidden-file" onchange="previewTTD(this)">
    </td>
  </tr>
</tbody>
</table>

<script>

const pegawai = {
    "Yusup Roni": {
        nipp: "49314",
        jabatan: "KS KNP",
        kedudukan: "Karangpucung"
    },

    "Cecep Iman Nurdin": {
        nipp: "49758",
        jabatan: "KAUR STL 2.10 BJR",
        kedudukan: "Banjar"
    },

    "Abung B.Z": {
        nipp: "49632",
        jabatan: "KAUR JR 2.13 BJR",
        kedudukan: "Banjar"
    },

    "Dian F": {
        nipp: "50502",
        jabatan: "SATKER JR 2.13 BJR",
        kedudukan: "Banjar"
    },

    "Fajar P": {
        nipp: "49758",
        jabatan: "KAUR STL 2.10 BJR",
        kedudukan: "Banjar"
    },

    "Alek N": {
        nipp: "48850",
        jabatan: "PPKA KNP",
        kedudukan: "Karangpucung"
    },

    "Andri Perdiansyah": {
        nipp: "46303",
        jabatan: "KUPT STL 2.10 BJR",
        kedudukan: "Banjar"
    },

    "Maman Suparman": {
        nipp: "44660",
        jabatan: "KUPT JR 2.13 BJR",
        kedudukan: "Banjar"
    }
};

// letakkan fungsi isiDataPegawai() di bawahnya
function isiDataPegawai(select) {

    const data = pegawai[select.value];
    if (!data) return;

    const tr = select.closest("tr");

    tr.cells[2].querySelector("input").value = data.nipp;
    tr.cells[3].querySelector("input").value = data.jabatan;
    tr.cells[4].querySelector("input").value = data.kedudukan;

    saveAll(false);
}


  // Script tetap sama untuk menjaga fungsi auto-save
  document.addEventListener('input', () => saveAll(false));
  document.addEventListener("change", () => saveAll(false));
  
  function previewTTD(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => {
        input.previousElementSibling.src = e.target.result;
        saveAll(false);
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

function saveAll(notify) {

  const rows = [];

  document.querySelectorAll("#personnelTable tbody tr").forEach(tr => {

const select = tr.querySelector("select");
const txt = tr.querySelectorAll('input[type="text"]');

rows.push({
    nama: select ? select.value : "",
    nipp: txt[0].value,
    jabatan: txt[1].value,
    kedudukan: txt[2].value,
    ttd: tr.querySelector(".ttd-preview").src
});

  });

  const data = {
    tgl: document.getElementById("tgl").value,
    waktu: document.getElementById("waktu").value,
    rows: rows
  };

  localStorage.setItem("daftarHadirData", JSON.stringify(data));

  if(notify) alert("Data tersimpan.");
}

function loadAll(){

    const saved = localStorage.getItem("daftarHadirData");
    if(!saved) return;

    const data = JSON.parse(saved);

    document.getElementById("tgl").value = data.tgl || "";
    document.getElementById("waktu").value = data.waktu || "";

    const tbody = document.querySelector("#personnelTable tbody");
    tbody.innerHTML = "";

    data.rows.forEach((r,i)=>{

        const tr = document.createElement("tr");

tr.innerHTML = `
<td>${i+1}</td>

<td>
<select onchange="isiDataPegawai(this)">
<option value="">-- Pilih Nama --</option>
<option value="Yusup Roni" ${r.nama=="Yusup Roni"?"selected":""}>Yusup Roni</option>
<option value="Cecep Iman Nurdin" ${r.nama=="Cecep Iman Nurdin"?"selected":""}>Cecep Iman Nurdin</option>
<option value="Abung B.Z" ${r.nama=="Abung B.Z"?"selected":""}>Abung B.Z</option>
<option value="Dian F" ${r.nama=="Dian F"?"selected":""}>Dian F</option>
<option value="Fajar P" ${r.nama=="Fajar P"?"selected":""}>Fajar P</option>
<option value="Alek N" ${r.nama=="Alek N"?"selected":""}>Alek N</option>
<option value="Andri Perdiansyah" ${r.nama=="Andri Perdiansyah"?"selected":""}>Andri Perdiansyah</option>
<option value="Maman Suparman" ${r.nama=="Maman Suparman"?"selected":""}>Maman Suparman</option>
</select>
</td>

<td><input type="text" value="${r.nipp}" readonly></td>
<td><input type="text" value="${r.jabatan}" readonly></td>
<td><input type="text" value="${r.kedudukan}" readonly></td>

<td class="upload-area" onclick="this.querySelector('input').click()">
<img class="ttd-preview" src="${r.ttd}">
<input type="file" class="hidden-file" onchange="previewTTD(this)">
</td>
`;

        tbody.appendChild(tr);

    });

}
document.getElementById("tgl").addEventListener("change", () => saveAll(false));
document.getElementById("waktu").addEventListener("change", () => saveAll(false));

 function addRow() {
  const tbody = document.querySelector("#personnelTable tbody");
  const row = tbody.rows[0].cloneNode(true);

  row.cells[0].innerText = tbody.rows.length + 1;

  row.querySelectorAll('input[type="text"]').forEach(i => i.value = "");
  row.querySelector(".ttd-preview").src = "";
  row.querySelector('input[type="file"]').value = "";

  tbody.appendChild(row);

  saveAll(false);
}

 function removeRow() {
  const tbody = document.querySelector("#personnelTable tbody");

  if (tbody.rows.length > 1) {
    tbody.deleteRow(-1);
    saveAll(false);
  }
}

  function resetAll() {
    if(confirm("Hapus semua data?")) {
      localStorage.removeItem('daftarHadirData');
      location.reload();
    }
  }

  function exportJSON() {
    const data = localStorage.getItem('daftarHadirData');
    if (!data) return alert("Belum ada data!");
    const blob = new Blob([data], {type: "application/json"});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "daftar_hadir.json";
    a.click();
  }

  function importJSON(e) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      localStorage.setItem('daftarHadirData', ev.target.result);
      location.reload();
    };
    reader.readAsText(e.target.files[0]);
  }

  window.onload = loadAll;
</script>
</body>
</html>
