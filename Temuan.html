<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Rekap Temuan Stasiun Karangpucung</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; margin-bottom: 20px; }
    th, td { border: 1px solid #000; text-align: center; padding: 5px; vertical-align: middle; }
    th { background-color: #f8aa02; font-weight: bold; }
    
    /* Style untuk area upload agar terlihat bersih */
    .upload-box { cursor: pointer; display: block; width: 100%; height: 80px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-input { display: none; } /* Menyembunyikan tombol choose file */
    .preview-img { max-width: 80px; max-height: 80px; object-fit: contain; }
    
    .status-dropdown { padding: 2px; font-weight: bold; border: none; cursor: pointer; }
    .closed { background-color: #4CAF50; color: white; }
    .progress { background-color: #FFC107; color: black; }
    .open { background-color: #F44336; color: white; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 4px; }
    .toolbar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    button { padding: 8px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body>

<div class="toolbar no-print">
  <button onclick="saveData(true)">💾 Simpan</button>
  <button onclick="window.print()">🖨️ Print PDF</button>
  <button onclick="exportJSON()">⬇️ Export JSON</button>
  <button onclick="document.getElementById('importFile').click()">⬆️ Import JSON</button>
  <input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
  <button onclick="resetAll()" style="background:#dc3545; color:white;">🗑️ Reset Semua</button>
</div>

<table>
  <caption><b>REKAP TEMUAN HASIL JI WILAYAH 2C TASIKMALAYA - STASIUN KARANGPUCUNG</b></caption>
  <thead>
    <tr>
      <th>NO</th><th>NO JI</th><th>HASIL TEMUAN</th><th>DOKUMENTASI</th>
      <th>TINDAK LANJUT</th><th>DOKUMENTASI TL</th><th>STATUS</th>
    </tr>
  </thead>
<tbody>
    <tr>
      <td>1</td>
      <td><input type="text" class="data-input" value="JI-01/ks.knp/VII/2026"></td>
      <td><textarea class="data-input"></textarea></td>
      <td>
        <label class="upload-box">
          <img class="preview-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
          <input type="file" class="img-input" onchange="previewImage(this)">
        </label>
      </td>
      <td><textarea class="data-input"></textarea></td>
      <td>
        <label class="upload-box">
          <img class="preview-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
          <input type="file" class="img-input" onchange="previewImage(this)">
        </label>
      </td>
      <td>
        <select class="status-dropdown" onchange="updateStatusClass(this)">
          <option value="">Pilih</option>
          <option value="Closed">Closed</option>
          <option value="Progress">Progress</option>
          <option value="Open">Open</option>
        </select>
      </td>
    </tr>
  </tbody>
</table>

<div class="no-print" style="margin-bottom: 30px;">
  <button onclick="addRow()">+ Tambah Baris</button>
  <button onclick="removeRow()">- Hapus Baris</button>
</div>

<script>
  document.addEventListener('input', () => saveData(false));
  document.addEventListener('change', () => saveData(false));

  function previewImage(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => {
        input.previousElementSibling.src = e.target.result;
        saveData(false);
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function updateStatusClass(select) {
    select.className = 'status-dropdown ' + select.value.toLowerCase();
    saveData(false);
  }

  function saveData(notify) {
    document.querySelectorAll('input[type="text"]').forEach(el => el.setAttribute('value', el.value));
    document.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
    document.querySelectorAll('select').forEach(el => {
      el.querySelectorAll('option').forEach(opt => opt.removeAttribute('selected'));
      el.options[el.selectedIndex].setAttribute('selected', 'selected');
    });
    const data = document.querySelector('tbody').innerHTML;
    localStorage.setItem('rekapTemuanData', JSON.stringify(data));
    if(notify) alert("Data berhasil disimpan!");
  }

  function loadData() {
    const saved = localStorage.getItem('rekapTemuanData');
    if (saved) {
      document.querySelector('tbody').innerHTML = JSON.parse(saved);
    }
  }

  function addRow() {
    const tbody = document.querySelector("table tbody");
    const templateRow = tbody.rows[0].cloneNode(true);
    templateRow.cells[0].innerText = tbody.rows.length + 1;
    templateRow.querySelectorAll("input, textarea, select").forEach(el => {
      if (el.type !== "file") el.value = "";
      if (el.tagName === "SELECT") el.className = "status-dropdown";
    });
    templateRow.querySelectorAll(".preview-img").forEach(img => {
      img.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
    });
    tbody.appendChild(templateRow);
  }

  function removeRow() {
    const tbody = document.querySelector("table tbody");
    if (tbody.rows.length > 1) tbody.deleteRow(-1);
  }

  function resetAll() {
    if(confirm("Yakin ingin menghapus semua data?")) {
      localStorage.removeItem('rekapTemuanData');
      location.reload();
    }
  }

  function exportJSON() {
    const data = localStorage.getItem('rekapTemuanData');
    const blob = new Blob([data], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = "rekap_temuan.json"; a.click();
  }

  function importJSON(e) {
    const reader = new FileReader();
    reader.onload = (event) => {
      localStorage.setItem('rekapTemuanData', event.target.result);
      location.reload();
    };
    reader.readAsText(e.target.files[0]);
  }

  window.onload = loadData;
</script>
</body>
</html>
